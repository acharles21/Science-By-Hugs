<script>

const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSd0zz3iz325LY_wNop-cl1rtuzlR4tC3ELgW3OP6S7EBDlToQ/viewform";

const PRODUCT_ENTRIES = [
  "entry.1197931972",
  "entry.501824321",
  "entry.1634362014",
  "entry.225021581",
  "entry.1443162562"
];

const QUANTITY_ENTRIES = [
  "entry.1524925872",
  "entry.1897693154",
  "entry.1942790890",
  "entry.365878363",
  "entry.900412488"
];


/* =========================================================
   VARIABLES
========================================================= */

let products = [];

let cart = [];

let selectedCategory = "All";

/* =========================================================
   CART
========================================================= */

function addToCart(productId) {

  const product = products.find(
    p => p.id === productId
  );

  if (!product) return;

  const existing = cart.find(
    item => item.id === productId
  );

  if (existing) {

    existing.quantity += 1;

  } else {

    cart.push({
      id: product.id,
      product: product.product,
      price: Number(product.price),
      quantity: 1
    });

  }

  updateCartButton();

  alert(
    `${product.product} added to your cart!`
  );

}


/* =========================================================
   UPDATE CART BUTTON
========================================================= */

function updateCartButton() {

  const totalItems = cart.reduce(
    (total, item) =>
      total + item.quantity,
    0
  );

  const cartButton =
    document.getElementById("cartButton");

  if (cartButton) {

    cartButton.innerHTML =
      `🛒 Cart (${totalItems})`;

  }

}


/* =========================================================
   CART TOTAL
========================================================= */

function getCartTotal() {

  return cart.reduce(
    (total, item) =>
      total +
      (item.price * item.quantity),
    0
  );

}

/* =========================================================
   SHOW CART
========================================================= */

function showCart() {

  closeDetail();

  document
    .querySelectorAll(".page")
    .forEach(page =>
      page.classList.remove("active")
    );

  document
    .getElementById("cartPage")
    .classList.add("active");


  document
    .getElementById("cartButton")
    .classList.add("active");

  document
    .getElementById("homeNav")
    .classList.remove("active");

  document
    .getElementById("productsNav")
    .classList.remove("active");


  renderCart();

  window.scrollTo({
    top: 0,
    behavior: "instant"
  });

}


/* =========================================================
   RENDER CART
========================================================= */

function renderCart() {

  const container =
    document.getElementById("cartContent");

  if (!container) return;

  if (cart.length === 0) {

    container.innerHTML = `
      <div class="empty">
        🛒
        <br><br>
        Your cart is empty.
        <br><br>
        Add some products to get started!
      </div>
    `;

    return;
  }


  let html = "";


  cart.forEach(item => {

    const itemTotal =
      item.price * item.quantity;


    html += `

      <div class="product-card">

        <div class="product-info">

          <div class="product-name">
            ${escapeHTML(item.product)}
          </div>

          <div class="product-category">
            $${formatPrice(item.price)} each
          </div>


          <div style="
            display:flex;
            align-items:center;
            gap:18px;
            margin-top:20px;
          ">

            <button
              onclick="changeQuantity(${item.id}, -1)"
              style="
                width:58px;
                height:58px;
                border:none;
                border-radius:18px;
                font-size:30px;
                font-weight:900;
                background:#eeeeee;
              "
            >
              −
            </button>


            <strong style="
              font-size:28px;
              min-width:30px;
              text-align:center;
            ">
              ${item.quantity}
            </strong>


            <button
              onclick="changeQuantity(${item.id}, 1)"
              style="
                width:58px;
                height:58px;
                border:none;
                border-radius:18px;
                font-size:30px;
                font-weight:900;
                background:#eeeeee;
              "
            >
              +
            </button>

          </div>

        </div>


        <div style="
          text-align:right;
          font-size:28px;
          font-weight:900;
        ">

          $${formatPrice(itemTotal)}

        </div>

      </div>

    `;

  });


  html += `

    <div style="
      background:white;
      border:1px solid #e1e4e8;
      border-radius:35px;
      padding:30px;
      margin-top:25px;
    ">

      <div style="
        font-size:26px;
        color:#858b93;
      ">
        Order Total
      </div>

      <div style="
        font-size:48px;
        font-weight:900;
        margin-top:8px;
      ">
        $${formatPrice(getCartTotal())}
      </div>


      <button
        class="order-button"
        onclick="submitCartOrder()"
      >
        🛒 ORDER NOW
      </button>

    </div>

  `;


  container.innerHTML = html;

}


/* =========================================================
   CHANGE QUANTITY
========================================================= */

function changeQuantity(productId, change) {

  const item =
    cart.find(item =>
      item.id === productId
    );

  if (!item) return;


  item.quantity += change;


  if (item.quantity <= 0) {

    cart =
      cart.filter(item =>
        item.id !== productId
      );

  }


  updateCartButton();

  renderCart();

}


/* =========================================================
   SUBMIT CART ORDER
========================================================= */

function submitCartOrder() {
  if (cart.length === 0) {
    alert("Your cart is empty.");
    return;
  }

  if (cart.length > 5) {
    alert("Please limit your order to 5 different products.");
    return;
  }

  const params = [];

  for (let i = 0; i < cart.length; i++) {
    const item = cart[i];

    params.push(
      `${PRODUCT_ENTRIES[i]}=${encodeURIComponent(item.product)}`
    );

    params.push(
      `${QUANTITY_ENTRIES[i]}=${encodeURIComponent(item.quantity)}`
    );
  }

  const orderUrl = `${FORM_URL}?${params.join("&")}`;

  window.open(orderUrl, "_blank");
}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

google.script.run

  .withSuccessHandler(function(data) {

    products = data || [];

    createCategories();

    renderFeatured();

    renderProducts();

  })

  .withFailureHandler(function(error) {

    console.error(error);

    document.getElementById("products").innerHTML = `

      <div class="empty">

        Unable to load products.

        <br><br>

        Please refresh the page.

      </div>

    `;

  })

  .getProducts();


/* =========================================================
   CREATE CATEGORIES
========================================================= */

function createCategories() {


  const categories = [

    "All",

    ...new Set(

      products

        .map(product => product.category)

        .filter(Boolean)

    )

  ];


  createCategoryGroup(

    "homeCategories",

    categories

  );


  createCategoryGroup(

    "productCategories",

    categories

  );

}


function createCategoryGroup(

  elementId,

  categories

) {


  const container =

    document.getElementById(elementId);


  container.innerHTML = "";


  categories.forEach(category => {


    const button =

      document.createElement("button");


    button.className =

      "category-button " +

      (

        category === "All"

        ? "active"

        : ""

      );


    button.innerText = category;


    button.onclick = function() {


      selectedCategory = category;


      document

        .querySelectorAll(".category-button")

        .forEach(button => {

          button.classList.remove("active");

        });


      document

        .querySelectorAll(".category-button")

        .forEach(button => {

          if (

            button.innerText === category

          ) {

            button.classList.add("active");

          }

        });


      showProducts();

      renderProducts();

    };


    container.appendChild(button);

  });

}


/* =========================================================
   FEATURED PRODUCTS
========================================================= */

function renderFeatured() {


  const container =

    document.getElementById("featured");


  const featured =

    products.filter(product =>

      product.featured === true

    );


  container.innerHTML = "";


  if (featured.length === 0) {


    container.innerHTML = `

      <div class="empty">

        No featured products yet.

      </div>

    `;


    return;

  }


  featured.forEach(product => {


    const card =

      document.createElement("div");


    card.className =

      "featured-card";


    let imageHTML;


    if (product.image) {


      imageHTML = `

        <img

          class="featured-image"

          src="${escapeHTML(product.image)}"

          alt="${escapeHTML(product.product)}"

          loading="lazy"

        >

      `;

    }

    else {


      imageHTML = `

        <div class="featured-placeholder">

          🌟

        </div>

      `;

    }


    card.innerHTML = `

      ${imageHTML}


      <div class="featured-name">

        ${escapeHTML(product.product)}

      </div>


      <div class="featured-price">

        $${formatPrice(product.price)}

      </div>

    `;


    card.onclick = function() {

      openDetail(product);

    };


    container.appendChild(card);

  });

}


/* =========================================================
   PRODUCTS
========================================================= */

function renderProducts() {


  const searchInput =

    document.getElementById(

      "productSearch"

    );


  const search =

    searchInput

      ? searchInput.value

          .toLowerCase()

          .trim()

      : "";


  const container =

    document.getElementById("products");


  const filtered =

    products.filter(product => {


      const categoryMatch =

        selectedCategory === "All" ||

        product.category ===

          selectedCategory;


      const productName =

        String(product.product)

          .toLowerCase();


      const categoryName =

        String(product.category)

          .toLowerCase();


      const searchMatch =

        productName.includes(search) ||

        categoryName.includes(search);


      return (

        categoryMatch &&

        searchMatch

      );

    });


  container.innerHTML = "";


  if (filtered.length === 0) {


    container.innerHTML = `

      <div class="empty">

        🔎

        <br><br>

        No products found.

      </div>

    `;


    return;

  }


  filtered.forEach(product => {


    const card =

      document.createElement("div");


    card.className =

      "product-card";


    /* IMAGE */

    let imageHTML;


    if (product.image) {


      imageHTML = `

        <img

          class="product-image"

          src="${escapeHTML(product.image)}"

          alt="${escapeHTML(product.product)}"

          loading="lazy"

        >

      `;

    }

    else {


      imageHTML = `

        <div class="placeholder">

          💉

        </div>

      `;

    }


    /* STATUS */

    const statusText =

      String(

        product.status ||

        "Available"

      );


    const statusLower =

      statusText.toLowerCase();


    let statusClass =

      "status-available";


    if (

      statusLower.includes("low")

    ) {

      statusClass =

        "status-low";

    }


    if (

      statusLower.includes("out")

    ) {

      statusClass =

        "status-out";

    }


    card.innerHTML = `

      ${imageHTML}


      <div class="product-info">


        <div class="product-name">

          ${escapeHTML(product.product)}

        </div>


        <div class="product-category">

          ${escapeHTML(product.category)}

        </div>


        <span

          class="status ${statusClass}"

        >

          ${escapeHTML(statusText)}

        </span>


      </div>


      <div class="product-price">

        $${formatPrice(product.price)}

      </div>

    `;


    card.onclick = function() {

      openDetail(product);

    };


    container.appendChild(card);

  });

}


/* =========================================================
   HOME SEARCH
========================================================= */

function homeSearch() {


  const search =

    document

      .getElementById("homeSearch")

      .value;


  showProducts();


  document.getElementById(

    "productSearch"

  ).value = search;


  renderProducts();

}


/* =========================================================
   SHOW HOME
========================================================= */

function showHome() {


  closeDetail();


  document

    .querySelectorAll(".page")

    .forEach(page =>

      page.classList.remove("active")

    );


  document

    .getElementById("homePage")

    .classList.add("active");


  document

    .getElementById("homeNav")

    .classList.add("active");


  document

    .getElementById("productsNav")

    .classList.remove("active");


  window.scrollTo({

    top: 0,

    behavior: "instant"

  });

}


/* =========================================================
   SHOW PRODUCTS
========================================================= */

function showProducts() {


  closeDetail();


  document

    .querySelectorAll(".page")

    .forEach(page =>

      page.classList.remove("active")

    );


  document

    .getElementById("productsPage")

    .classList.add("active");


  document

    .getElementById("productsNav")

    .classList.add("active");


  document

    .getElementById("homeNav")

    .classList.remove("active");


  renderProducts();


  window.scrollTo({

    top: 0,

    behavior: "instant"

  });

}


/* =========================================================
   PRODUCT DETAIL
========================================================= */

function openDetail(product) {

  const detail =
    document.getElementById("detail");

  const container =
    document.getElementById("detailContent");


  /* IMAGE */

  let imageHTML;

  if (product.image) {

    imageHTML = `
      <img
        class="detail-image"
        src="${escapeHTML(product.image)}"
        alt="${escapeHTML(product.product)}"
      >
    `;

  } else {

    imageHTML = `
      <div class="detail-placeholder">
        💉
      </div>
    `;

  }


  /* STATUS */

  const statusText =
    String(
      product.status ||
      "Available"
    );

  const statusLower =
    statusText.toLowerCase();


  let statusClass =
    "status-available";


  if (statusLower.includes("low")) {
    statusClass = "status-low";
  }


  if (statusLower.includes("out")) {
    statusClass = "status-out";
  }


  /* ORDER BUTTON */

  let orderHTML;

  if (statusLower.includes("out")) {

    orderHTML = `
      <button
        class="order-button"
        style="background:#999"
        disabled
      >
        🚫 OUT OF STOCK
      </button>
    `;

  } else {

    orderHTML = `
      <button
        class="order-button"
        onclick="addToCart(${product.id})"
      >
        🛒 ADD TO CART
      </button>
    `;

  }


  /* DETAIL CONTENT */

  container.innerHTML = `

    ${imageHTML}

    <div class="detail-category">
      ${escapeHTML(product.category)}
    </div>

    <div class="detail-name">
      ${escapeHTML(product.product)}
    </div>

    <div class="detail-price">
      $${formatPrice(product.price)}
    </div>

    <span class="status ${statusClass}">
      ${escapeHTML(statusText)}
    </span>

    ${orderHTML}

  `;


  detail.classList.add("active");

  document.body.style.overflow = "hidden";

  detail.scrollTop = 0;

}
/* =========================================================
   CLOSE DETAIL
========================================================= */

function closeDetail() {


  document

    .getElementById("detail")

    .classList.remove("active");


  document.body.style.overflow = "";

}


/* =========================================================
   FORMAT PRICE
========================================================= */

function formatPrice(price) {


  const number =

    Number(price);


  if (isNaN(number)) {

    return "0.00";

  }


  return number.toFixed(2);

}


/* =========================================================
   SECURITY
========================================================= */

function escapeHTML(value) {


  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}
