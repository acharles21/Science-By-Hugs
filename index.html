<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Science by HUGs</title>

  <link rel="apple-touch-icon" sizes="180x180" href="./icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Science by HUGs">

  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #E6F6FE;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      width: min(88vw, 420px);
      padding: 34px 26px;
      text-align: center;
      background: white;
      border-radius: 28px;
      box-shadow: 0 12px 35px rgba(0,0,0,.10);
    }
    img {
      width: 120px;
      height: 120px;
      border-radius: 26px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }
    p {
      color: #6f7780;
      font-size: 17px;
      line-height: 1.45;
      margin-bottom: 25px;
    }
    a {
      display: block;
      padding: 17px;
      border-radius: 16px;
      background: #18202a;
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="./icon.png" alt="Science by HUGs">
    <h1>Science by HUGs</h1>
    <p>Tap below to open the storefront.</p>
    <a href="https://script.google.com/macros/s/AKfycbzinsZm0UTX4puZdr8yiy6FzzRMZuIUbPiYsyU_XT20avvmhbC_z_7Qfrqk7C7h2qCuYQ/exec">OPEN STOREFRONT</a>
  </main>
</body>
</html>
