<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Science by HUGs</title>

  <link rel="apple-touch-icon" sizes="180x180" href="./icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Science by HUGs">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #f5f6f8;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
    }

    .install-page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }

    .card {
      max-width: 420px;
      padding: 32px;
      border-radius: 24px;
      background: white;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    .card img {
      width: 110px;
      height: 110px;
      border-radius: 24px;
    }

    .card h1 {
      margin: 18px 0 8px;
      font-size: 28px;
    }

    .card p {
      margin: 0;
      color: #6b7280;
      line-height: 1.5;
    }

    .card a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 18px;
      border-radius: 12px;
      background: #18202a;
      color: white;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <div class="install-page">
    <div class="card">
      <img src="./icon.png" alt="Science by HUGs">
      <h1>Science by HUGs</h1>
      <p>Opening the storefront…</p>
      <a href="https://script.google.com/macros/s/AKfycbzinsZm0UTX4puZdr8yiy6FzzRMZuIUbPiYsyU_XT20avvmhbC_z_7Qfrqk7C7h2qCuYQ/exec" id="fallback">Open Storefront</a>
    </div>
  </div>

  <script>
    // Keep the GitHub Pages page available for iPhone's Add to Home Screen
    // process so the custom apple-touch-icon is detected.
    //
    // Once the Home Screen web app is launched, go directly to Apps Script
    // so google.script.run works in its native Apps Script environment.

    const isStandalone =
      window.navigator.standalone === true ||
      window.matchMedia("(display-mode: standalone)").matches;

    if (isStandalone) {
      window.location.replace("https://script.google.com/macros/s/AKfycbzinsZm0UTX4puZdr8yiy6FzzRMZuIUbPiYsyU_XT20avvmhbC_z_7Qfrqk7C7h2qCuYQ/exec");
    } else {
      // When visiting normally in Safari, leave the page visible long enough
      // to allow Add to Home Screen to recognize the custom icon.
      document.getElementById("fallback").style.display = "inline-block";
    }
  </script>
</body>
</html>
