<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay with PayPal — Science by HUGs</title>

  <script src="https://www.paypal.com/sdk/js?client-id=BAAW2UnJsd-eCKCVWI6_EhdCQKGou30R_f8bGIy2RsqQ_qKSROiS5wAuuNaH2mruW08Cup2A1mSKrilZVM&components=hosted-buttons&enable-funding=venmo&currency=USD"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "SF Pro Text", Arial, sans-serif;
      background: #0b0b0d;
      color: #f5f5f7;
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 20px 50px;
    }

    .back {
      display: inline-block;
      color: #a9a9b0;
      text-decoration: none;
      font-size: 15px;
      margin-bottom: 28px;
    }

    .brand {
      text-align: center;
      margin-bottom: 34px;
    }

    .brand h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: -0.8px;
    }

    .brand p {
      margin: 8px 0 0;
      color: #a9a9b0;
      font-size: 16px;
    }

    .payment-card {
      background: #151518;
      border: 1px solid #29292e;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 16px;
    }

    .payment-card h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .payment-card p {
      margin: 0 0 20px;
      color: #a9a9b0;
      font-size: 14px;
      line-height: 1.5;
    }

    .paypal-button {
      min-height: 45px;
    }
  </style>
</head>

<body>

  <main class="page">

    <a class="back" href="./pay.html">
      ‹ Back to Payment Options
    </a>

    <div class="brand">
      <h1>Science by HUGs</h1>
      <p>Pay securely with PayPal.</p>
    </div>

    <section class="payment-card">

      <h2>Pay with PayPal</h2>

      <p>
        Select the appropriate payment option below to continue securely through PayPal.
      </p>

      <div
        id="paypal-container-99BF96EKFWSPA"
        class="paypal-button"
      ></div>

    </section>

  </main>

  <script>
    paypal.HostedButtons({
      hostedButtonId: "99BF96EKFWSPA"
    }).render("#paypal-container-99BF96EKFWSPA");
  </script>

</body>
</html>
